<!--
  Topbar search. Replaces the theme's Simple-Jekyll-Search loader with a ranked search over
  posts, YouTube videos and pages (index: assets/js/data/search.json).
  The theme's own script still shows and hides the results panel as the input changes.
-->

<script>
  (function () {
    const input = document.getElementById('search-input');
    const results = document.getElementById('search-results');
    if (!input || !results) return;

    const MAX_RESULTS = 12;
    const noResults = '<p class="mt-5">{{ site.data.locales[site.lang].search.no_results | default: 'Oops! No results found.' }}</p>';
    let index = null;
    let loading = null;

    /* Lowercase and drop accents so "cafe" matches "Café" */
    const fold = (text) => (text || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const escapeHtml = (text) =>
      (text || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const escapeRegExp = (text) => text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    function load() {
      loading =
        loading ||
        fetch('{{ "/assets/js/data/search.json" | relative_url }}')
          .then((response) => response.json())
          .then((items) => {
            index = items.map((item) => ({
              ...item,
              _title: fold(item.title),
              _meta: fold(`${item.categories} ${item.tags} ${item.type}`),
              _content: fold(item.content)
            }));
          })
          .catch(() => (index = []));
      return loading;
    }

    /* Score how well one search word matches a field: whole word > word start > anywhere */
    function wordScore(field, word, weight) {
      const at = field.indexOf(word);
      if (at === -1) return 0;
      const startsWord = at === 0 || /\W/.test(field[at - 1]);
      const end = at + word.length;
      const endsWord = end === field.length || /\W/.test(field[end]);
      return weight * (startsWord ? (endsWord ? 3 : 2) : 1);
    }

    function score(item, words, phrase) {
      let total = 0;
      for (const word of words) {
        const s =
          wordScore(item._title, word, 10) + wordScore(item._meta, word, 5) + Math.min(wordScore(item._content, word, 1), 3);
        if (s === 0) return 0; /* every word has to match somewhere */
        total += s;
      }
      if (words.length > 1 && item._title.includes(phrase)) total += 20;
      if (item._title.startsWith(phrase)) total += 10;
      return total;
    }

    function highlight(text, words) {
      const escaped = escapeHtml(text);
      if (words.length === 0) return escaped;
      const pattern = new RegExp(`(${words.map((w) => escapeRegExp(escapeHtml(w))).join('|')})`, 'gi');
      return escaped.replace(pattern, '<mark>$1</mark>');
    }

    /* Show the part of the content around the first match instead of always the opening */
    function snippet(item, words) {
      const content = item.content || '';
      if (!content) return '';
      const hits = words.map((w) => item._content.indexOf(w)).filter((i) => i >= 0);
      const first = hits.length ? Math.min(...hits) : 0;
      const start = Math.max(0, first - 60);
      let text = content.slice(start, start + 200).trim();
      if (start > 0) text = '…' + text;
      if (start + 200 < content.length) text += '…';
      return highlight(text, words);
    }

    const icons = { Post: 'far fa-file-alt', Video: 'fab fa-youtube', Page: 'far fa-window-maximize' };

    function render(item, words) {
      const external = /^https?:/.test(item.url);
      const target = external ? ' target="_blank" rel="noopener noreferrer"' : '';
      const meta = [
        `<span class="search-type search-type-${item.type.toLowerCase()}"><i class="${icons[item.type] || 'fas fa-file'} fa-fw"></i>${item.type}</span>`,
        item.categories ? `<div class="me-sm-4"><i class="far fa-folder fa-fw"></i>${highlight(item.categories, words)}</div>` : '',
        item.tags ? `<div class="me-sm-4"><i class="fa fa-tag fa-fw"></i>${highlight(item.tags, words)}</div>` : ''
      ].join('');
      const body = item.type === 'Video' ? '' : `<p>${snippet(item, words)}</p>`;
      return `<article class="px-1 px-sm-2 px-lg-4 px-xl-0">
          <header>
            <h2><a href="${escapeHtml(item.url)}"${target}>${highlight(item.title, words)}</a></h2>
            <div class="post-meta d-flex flex-column flex-sm-row text-muted mt-1 mb-1">${meta}</div>
          </header>
          ${body}
        </article>`;
    }

    function search() {
      const phrase = fold(input.value).trim().replace(/\s+/g, ' ');
      if (!phrase) {
        results.innerHTML = '';
        return;
      }
      const words = phrase.split(' ');
      const matches = index
        .map((item) => ({ item, score: score(item, words, phrase) }))
        .filter((m) => m.score > 0)
        .sort((a, b) => b.score - a.score || (b.item.date || '').localeCompare(a.item.date || ''));

      if (matches.length === 0) {
        results.innerHTML = noResults;
        return;
      }
      const shown = matches.slice(0, MAX_RESULTS);
      const count =
        matches.length > MAX_RESULTS
          ? `Top ${MAX_RESULTS} of ${matches.length} results`
          : `${matches.length} result${matches.length === 1 ? '' : 's'}`;
      results.innerHTML =
        `<p class="search-count">${count}</p>` + shown.map((m) => render(m.item, input.value.trim().split(/\s+/))).join('');
    }

    input.addEventListener('focus', load, { once: true });
    input.addEventListener('input', () => (index ? search() : load().then(search)));

    /* Enter opens the top (or selected) result; arrow keys move through results */
    input.addEventListener('keydown', (event) => {
      const links = Array.from(results.querySelectorAll('article h2 a'));
      if (event.key === 'Enter' && links.length) {
        event.preventDefault();
        links[0].click();
      } else if (event.key === 'ArrowDown' && links.length) {
        event.preventDefault();
        links[0].focus();
      }
    });
    results.addEventListener('keydown', (event) => {
      const links = Array.from(results.querySelectorAll('article h2 a'));
      const at = links.indexOf(document.activeElement);
      if (at === -1) return;
      if (event.key === 'ArrowDown' && at < links.length - 1) {
        event.preventDefault();
        links[at + 1].focus();
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        (at === 0 ? input : links[at - 1]).focus();
      }
    });
  })();
</script>
