<!-- "New video" banner for the Music page: lists every video published in the last NEW_DAYS
     days, newest first. Closing it hides it until a newer video comes out (per browser).
     Each section's 5 newest videos are written out hidden; the script picks the recent ones.
     Use /* */ comments in this script: the production HTML compressor joins lines. -->
<div class="new-video-banner" role="status" hidden>
  <span class="new-video-badge"><i class="fas fa-bell"></i> <span class="new-video-heading">New video</span></span>
  <ul class="new-video-list">
    {% for section in include.sections %}
      {% for video in section.videos limit: 5 %}
        <li data-video="{{ video.id }}" data-published="{{ video.published }}" hidden>
          <a class="new-video-link" href="{{ video.url }}" target="_blank" rel="noopener noreferrer">
            <span class="new-video-section">{{ section.title }}:</span> {{ video.title }}&nbsp;<i class="fas fa-arrow-right" aria-hidden="true"></i>
          </a>
        </li>
      {% endfor %}
    {% endfor %}
  </ul>
  <button type="button" class="new-video-close" aria-label="Dismiss new video banner">
    <i class="fas fa-times"></i>
  </button>
</div>

<script>
  (function () {
    const NEW_DAYS = 7;
    const KEY = 'new-video-dismissed';
    const banner = document.querySelector('.new-video-banner');
    const list = banner.querySelector('.new-video-list');

    const recent = Array.from(list.children)
      .map((item) => ({ item, age: (Date.now() - new Date(item.dataset.published)) / 86400000 }))
      .filter(({ age }) => age >= 0 && age <= NEW_DAYS)
      .sort((a, b) => a.age - b.age)
      .map(({ item }) => item);
    if (recent.length === 0) return;

    /* Closing remembers the newest video, so the banner returns when a newer one comes out */
    const newestId = recent[0].dataset.video;
    try {
      if (localStorage.getItem(KEY) === newestId) return;
    } catch (error) {
      /* storage blocked: just show the banner */
    }

    recent.forEach((item) => {
      item.hidden = false;
      list.appendChild(item); /* newest first */
    });
    banner.querySelector('.new-video-heading').textContent =
      recent.length === 1 ? 'New video' : `${recent.length} new videos`;
    banner.hidden = false;

    banner.querySelector('.new-video-close').addEventListener('click', function () {
      banner.hidden = true;
      try {
        localStorage.setItem(KEY, newestId);
      } catch (error) {
        /* storage blocked: it just shows again next visit */
      }
    });
  })();
</script>
