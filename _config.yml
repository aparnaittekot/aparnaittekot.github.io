# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy
baseurl: ''
# Change the following value to '/PROJECT_NAME' ONLY IF your site type is GitHub Pages Project sites
# and doesn't have a custom domain.
# baseurl: ''

# The language of the webpage › http://www.lingoes.net/en/translator/langcode.htm
# If it has the same name as one of the files in folder `_data/locales`, the layout language will also be changed,
# otherwise, the layout language will use the default value of 'en'.
lang: en

# Change to your timezone › http://www.timezoneconverter.com/cgi-bin/findzone/findzone
timezone: Asia/Calcutta 

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# --------------------------

title: Aparna's Portfolio # the main title

tagline: "" # optional line under the title; empty hides it
description: 
  
# fill in the base hostname & protocol for your site, e.g., 'https://username.github.io'
url: https://aparnaittekot.com/
authors: [Aparna Ittekot]             # change to your full name

github:
  username: aparnaittekot           # change to your github username

youtube:
  url: https://www.youtube.com/@instro_muse/videos
  # YouTube Data API key the Music page uses to load the newest videos (once a day per browser)
  # (_includes/youtube-live.html). It is visible in the page, so in Google Cloud it is
  # restricted to this site's address and to the YouTube Data API only.
  api_key: AIzaSyCUaQxvA9oFcly57S1jjNwFS_E3i49itSM
  # Sections on the Music page, read from these playlists. The build-time list from
  # _plugins/youtube-feed.rb is shown first and used if the live request fails.
  sections:
    - id: covers
      title: Keyboard Covers
      latest_label: Latest cover # heading of this section's card in the "Latest" strip
      label_prefix: "Keyboard Covers - " # tiles show the rest of the playlist name, e.g. "English Songs"
      playlists:
        - PLtniji69-8wIAJgompURXA1Usota1iexo # Keyboard Covers - English Songs
        - PLtniji69-8wKC63HhRzatikgWaLtAnoA3 # Keyboard Covers - Western Classical
        - PLtniji69-8wLmj2y2r0A2NfgLvOG1vTfD # Keyboard Covers - Tamil Songs
    - id: theory
      title: Music Theory
      latest_label: Latest music theory
      playlists:
        - PLtniji69-8wKtFUzWQu7jZj7Sygs-OvYB # Simplified Music Theory

social:
  name: Aparna Ittekot              # it will shows as the copyright owner in Footer
  email: aparnaittkot@gmail.com  # change to your email address
  links:
    # The first element serves as the copyright owner's link
    - https://aparnaittekot.com/ #change to your github homepage

# google_site_verification: mlwABpnF22MCyeNCQoei9VdIPvqy_uV7b4v_vArTxXM # change to your verification string
# --------------------------

google_analytics:
  id: 'G-WJ6GML954P'          # Fill with your Google Analytics ID
  pv:
    # The Google Analytics pageviews switch.
    # DO NOT enable it unless you know how to deploy the Google Analytics superProxy.
    enabled: false
    # the next options only valid when `google_analytics.pv` is enabled.
    proxy_url: ''
    #proxy_endpoint: ''
    proxy_endpoint: false
    cache: false  # pv data local cache, good for the users from GFW area.

# Prefer color scheme setting.
#
# Note: Keep empty will follow the system prefer color by default,
# and there will be a toggle to switch the theme between dark and light
# on the bottom left of the sidebar.
#
# Available options:
#
#     light  - Use the light color scheme
#     dark   - Use the dark color scheme
#
theme_mode: light

# The CDN endpoint for images.
# Notice that once it is assigned, the CDN url
# will be added to all image (site avatar & posts' images) paths starting with '/'
#
# e.g. 'https://cdn.com'
img_cdn: ''

# the avatar on sidebar, support local or CORS resources
avatar: /assets/img/site/avatar.png

# boolean type, the global switch for ToC in posts.
toc: true
future: false

comments:
  provider: disqus
  active: disqus
  disqus:
    shortname: aparnaittekot
    
disqus:
  comments: true  # boolean type, the global switch for posts comments.
  shortname: 'aparnaittekot'    # Fill with your Disqus shortname. › https://help.disqus.com/en/articles/1717111-what-s-a-shortname

paginate: 10

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order
  new_words:
    output: true

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true # Enable comments in posts.
      toc: true # Display TOC column in posts.
      # DO NOT modify the following parameter unless you are confident enough
      # to update the code of all other post links in this project.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # see `site.collections`
    values:
      layout: page
      permalink: /:title/
  - scope:
      path: assets/img/favicons
    values:
      swcache: true
  - scope:
      path: assets/js/dist
    values:
      swcache: true

sass:
  style: compressed
  load_paths:
    - _sass
    - assets/css

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - rollup.config.js
  - package*.json
  - "*(OLD).*"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

custom_css:
  - assets/css/custom.scss
