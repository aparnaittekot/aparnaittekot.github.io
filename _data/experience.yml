    highlights:
      - "Designed and implemented an extensible pre-approval framework for the ad review system, with healthcare as the pilot use case. Led seamless integration with LegitScript, a trusted third-party provider, to enable pharmaceutical pre-approvals for healthcare advertisers. Additionally, developed a self-serve portal empowering advertisers to manage their own pre-approval submissions, reducing manual overhead and accelerating turnaround times."
      - "Expanded ad review capabilities to support custom and priority questions for Brand Lift Test Ads, increasing flexibility and enhancing advertiser insights."
      - "Introduced an asynchronous review workflow to improve fairness and scalability, ensuring no single review source created bottlenecks while effectively balancing traffic surges and optimizing processing efficiency."
      - "Strengthened system reliability by implementing dynamic alerting and auto-scaling mechanisms. Calibrated alerts based on real-time data trends, significantly reducing false positives and minimizing on-call fatigue for the engineering team."
