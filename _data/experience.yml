  # a `heading:` entry starts a sub-list (e.g. one per project).
  - title: Senior Software Engineer
    org: linkedin
    company: LinkedIn
    start: 2023-10
    project: Developer Productivity AI Platform
    description:
      - "Current project: Working on Developer Productivity AI Platform"
      - "Previous project: Ads Review system is responsible for reviewing ads to ensure they adhere to LinkedIn policies before being published on the platform."
    highlights:
      - "Piloted Video Content Review: As video ads grew on LinkedIn, I piloted and enabled video content review by leveraging machine learning models, including object detection on key frames, to identify fraudulent or violative content."
      - "Enabled LLM powered features in Ads Review System: There was a need to build stronger defenses within the ads review system to detect policy-violating ads with higher accuracy, including scam content and ads improperly referencing LinkedIn."
      - "Onboarded several new LinkedIn Ad Types to the ads review system (Ad format onboarding): I piloted ads review support for new ad formats such as Sponsored Newsletter Ads, Sponsored Editorial Videos, and custom images for Lead Gen Forms. These initiatives required integration across multiple components of the ads review system."
      - "Piloted support of ad review for non-english ads on the platform: With the expansion of member-boosted post ads, I enabled support for non-English ad review by building capabilities to review and evaluate multilingual content within the ads review system"
      - "Spearheaded the self-serve ad review process guide: Led and developed an in-house self-serve onboarding guide to enable cross-functional teams to integrate with the ads review system, detailing processes across ads review, transparency, and control components."
      - "I have provided mentoring, knowledge sharing support to the juniors in the team. My deep knowledge in the LinkedIn tech stack helped the juniors succeed in the team."

